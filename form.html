<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Patient Pre-Admission Form - City General Hospital</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 0; background-color: #f4f6f9; color: #333; }
        header { background-color: #0056b3; color: white; padding: 20px; text-align: center; }
        nav { display: flex; justify-content: center; background-color: #004085; padding: 10px; }
        nav a { color: white; text-decoration: none; margin: 0 15px; font-weight: bold; }
        nav a:hover { text-decoration: underline; }
        .container { max-width: 600px; margin: 30px auto; padding: 20px; background: white; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input, select, textarea { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        .btn { display: block; width: 100%; background: #28a745; color: white; padding: 12px; border: none; border-radius: 5px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 20px; }
        .btn:hover { background: #218838; }
    </style>
</head>
<body>

    <header>
        <h1>City General Hospital</h1>
        <p>Online Patient Pre-Admission Portal</p>
    </header>

    <nav>
        <a href="index.html">Home</a>
        <a href="form.html">Admission Form</a>
    </nav>

    <div class="container">
        <h2>Patient Admission Form</h2>
        <form onsubmit="alert('Pre-admission form submitted successfully! Our team will contact you shortly.'); return false;">
            <div class="form-group">
                <label for="fullname">Full Name:</label>
                <input type="text" id="fullname" name="fullname" required placeholder="Enter patient's full name">
            </div>

            <div class="form-group">
                <label for="age">Age:</label>
                <input type="number" id="age" name="age" required placeholder="Enter age">
            </div>

            <div class="form-group">
                <label for="gender">Gender:</label>
                <select id="gender" name="gender">
                    <option value="male">Male</option>
                    <option value="female">Female</option>
                    <option value="other">Other</option>
                </select>
            </div>

            <div class="form-group">
                <label for="phone">Contact Number:</label>
                <input type="tel" id="phone" name="phone" required placeholder="Enter phone number">
            </div>

            <div class="form-group">
                <label for="department">Preferred Department / Specialist:</label>
                <select id="department" name="department">
                    <option value="general-physician">General Health - General Physician</option>
                    <option value="cardiologist">Doctor of Heart - Cardiologist</option>
                    <option value="neurologist">Doctor of Brain - Neurologist</option>
                    <option value="dermatologist">Doctor of Skin - Dermatologist</option>
                    <option value="dentist">Doctor of Teeth - Dentist</option>
                    <option value="ophthalmologist">Doctor of Eyes - Ophthalmologist</option>
                    <option value="orthopedic">Doctor of Bones - Orthopedic Doctor</option>
                    <option value="pediatrician">Doctor of Children - Pediatrician</option>
                    <option value="gynecologist">Doctor of Women - Gynecologist</option>
                    <option value="oncologist">Doctor of Cancer - Oncologist</option>
                    <option value="neurosurgeon">Doctor of Nerves - Neurosurgeon</option>
                    <option value="geriatrician">Doctor of Old People - Geriatrician</option>
                    <option value="nephrologist">Doctor of Kidneys - Nephrologist</option>
                    <option value="gastroenterologist">Doctor of Stomach - Gastroenterologist</option>
                    <option value="ent">Doctor of Ear, Nose, Throat - ENT Specialist</option>
                    <option value="hematologist">Doctor of Blood - Hematologist</option>
                    <option value="pulmonologist">Doctor of Lungs - Pulmonologist</option>
                    <option value="psychiatrist">Doctor of Mental Health - Psychiatrist</option>
                    <option value="hepatologist">Doctor of Liver - Hepatologist</option>
                    <option value="endocrinologist">Doctor of Hormones - Endocrinologist</option>
                    <option value="obstetrician">Doctor of Pregnancy - Obstetrician</option>
                    <option value="rheumatologist">Doctor of Joints - Rheumatologist</option>
                    <option value="infectiologist">Doctor of Infections - Infectiologist</option>
                    <option value="allergist">Doctor of Allergies - Allergist</option>
                    <option value="immunologist">Doctor of Immune System - Immunologist</option>
                    <option value="urologist">Doctor of Urinary System - Urologist</option>
                    <option value="proctologist">Doctor of Digestion - Proctologist</option>
                    <option value="midwife-obstetrician">Doctor of Childbirth - Midwife / Obstetrician</option>
                    <option value="sports-medicine">Doctor of Sports Injuries - Sports Medicine Doctor</option>
                    <option value="anesthesiologist">Doctor of Anesthesia - Anesthesiologist</option>
                </select>
            </div>

            <div class="form-group">
                <label for="symptoms">Brief Description of Symptoms / Reason for Admission:</label>
                <textarea id="symptoms" name="symptoms" rows="4" placeholder="Describe medical condition or symptoms"></textarea>
            </div>

            <button type="submit" class="btn">Submit Admission Form</button>
        </form>
    </div>

</body>
</html>
